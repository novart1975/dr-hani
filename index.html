<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تحت الصيانة</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0F1F;--surface:#141C30;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --text:#EAF0FF;--muted:#94A1C2;
  --blue:#4F86FF;--violet:#9B6BFF;--mint:#2FD9A6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Naskh Arabic',system-ui,sans-serif;
  background:var(--ink);color:var(--text);min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:28px;overflow:hidden;position:relative;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(620px 380px at 80% 10%,rgba(155,107,255,.18),transparent 60%),
    radial-gradient(560px 360px at 12% 30%,rgba(79,134,255,.18),transparent 60%),
    radial-gradient(520px 320px at 55% 92%,rgba(47,217,166,.12),transparent 60%);
}
.card{position:relative;z-index:1;max-width:540px}
h1{font-family:'Amiri',serif;line-height:1.4}

.gear-wrap{position:relative;width:120px;height:120px;margin:0 auto 34px}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line2);animation:pulse 2.6s ease-in-out infinite}
.ring.r2{inset:-14px;border-color:rgba(79,134,255,.25);animation-delay:.4s}
.gear-core{
  position:absolute;inset:22px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--violet) 55%,var(--mint));
  box-shadow:0 16px 40px -12px rgba(79,134,255,.6);
}
.gear-core svg{width:40px;height:40px;color:#08101f;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

.badge{
  display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;
  color:var(--mint);background:rgba(47,217,166,.12);border:1px solid rgba(47,217,166,.3);
  padding:7px 16px;border-radius:100px;margin-bottom:22px;font-family:'Space Grotesk';
}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}

h1{font-size:clamp(30px,6vw,46px);margin-bottom:18px}
.card > p{font-size:clamp(16px,2.4vw,18px);color:var(--muted);line-height:1.9}

.bar{height:7px;border-radius:100px;background:var(--surface);overflow:hidden;margin:32px auto 0;max-width:340px;border:1px solid var(--line)}
.bar span{display:block;height:100%;width:40%;border-radius:100px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--mint));animation:load 2.2s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

@media (prefers-reduced-motion:reduce){
  .gear-core svg,.ring,.badge .dot,.bar span{animation:none}
}
</style>
</head>
<body>
  <div class="card">
    <div class="gear-wrap">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="gear-core">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
    </div>

    <span class="badge"><span class="dot"></span> UNDER MAINTENANCE</span>

    <h1>الموقع تحت الصيانة</h1>
   

    <div class="bar"><span></span></div>
  </div>
</body>
</html>
